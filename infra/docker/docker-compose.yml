services:
  # The one production update loop (stat CSVs, draft refresh, dashboard
  # exports, roster/rank history, Discord milestones) -- see
  # stat_updater.py. The old gdoc-updater service (which additionally
  # pushed to Google Sheets) was retired 2026-10-07; see legacy/gdoc/README.md.
  stat-updater:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: unisfantasy-stat-updater
    command: ["python", "-m", "services.stat_updater.entrypoint"]
    env_file:
      - ./env/stat-updater.env
    volumes:
      - /srv/unisfantasy/data:/srv/unisfantasy/data
      - /srv/unisfantasy/secrets:/srv/unisfantasy/secrets:ro
    restart: unless-stopped
    ports:
      - "5001:5001"

  # Tag @FeatureBot in Discord to log a feature request -- appends the
  # message to /srv/unisfantasy/data/feature_requests.md and reacts with a
  # checkbox. See discord/feature_bot.py. Also runs the weekly Top 6 role
  # sync, which calls dashboard-api like stat-bot does.
  feature-bot:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: unisfantasy-feature-bot
    command: ["python", "-m", "services.feature_bot.entrypoint"]
    env_file:
      - ./env/feature-bot.env
    volumes:
      - /srv/unisfantasy/data:/srv/unisfantasy/data
    depends_on:
      - dashboard-api
    restart: unless-stopped

  # Slash commands for quick stat lookups (standings-check, champ-check,
  # score-check, etc.) -- calls dashboard-api over HTTP rather than
  # importing Models directly, so it stays small. See discord/stat_bot.py.
  stat-bot:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: unisfantasy-stat-bot
    command: ["python", "-m", "services.stat_bot.entrypoint"]
    env_file:
      - ./env/stat-bot.env
    volumes:
      - /srv/unisfantasy/data:/srv/unisfantasy/data
    depends_on:
      - dashboard-api
    restart: unless-stopped

  # Web app backend (dashboard_site) -- separate, lighter Dockerfile than
  # gdoc-updater/discord-bot (see Dockerfile.dashboard). Deliberately no
  # `ports:` here: only reachable inside the compose network, at
  # dashboard-api:8090. caddy is the sole public entry point.
  dashboard-api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dashboard
    container_name: unisfantasy-dashboard-api
    environment:
      FANTASY_REF_DIR: /srv/unisfantasy/data/ref
    # ROSTER_OPTIMIZER_PASSWORD lives here, on the droplet only (see
    # env/dashboard-api.env.example). Optional: without the file the Roster
    # Optimizer endpoint just reports itself as off (503).
    env_file:
      - path: ./env/dashboard-api.env
        required: false
    volumes:
      - /srv/unisfantasy/data:/srv/unisfantasy/data:ro
    restart: unless-stopped

  # Public, read-only MCP server (league stats as AI-chat tools) -- see
  # mcp_server/server.py and _planning/mcp-server.md. Proxies dashboard-api
  # over the compose network; caddy routes /mcp* here. No `ports:` for the
  # same reason as dashboard-api. mem_limit keeps it from crowding the
  # droplet's ~1 GB.
  mcp-server:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp
    container_name: unisfantasy-mcp-server
    environment:
      DASHBOARD_API_BASE_URL: http://dashboard-api:8090
      PORT: "8091"
    mem_limit: 128m
    depends_on:
      - dashboard-api
    restart: unless-stopped

  # Reverse proxy + automatic HTTPS (Let's Encrypt) in front of
  # dashboard-api. Caddyfile currently points at a sslip.io hostname (no
  # owned domain yet) -- swap to a real domain there + point DNS when one
  # is purchased, no other changes needed.
  caddy:
    image: caddy:2-alpine
    container_name: unisfantasy-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard-api
      - mcp-server

volumes:
  caddy_data:
  caddy_config:
