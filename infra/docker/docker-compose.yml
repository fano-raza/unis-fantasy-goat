services:
  gdoc-updater:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: unisfantasy-gdoc-updater
    command: ["python", "-m", "services.gdoc_updater.entrypoint"]
    env_file:
      - ./env/gdoc-updater.env
    volumes:
      - /srv/unisfantasy/data:/srv/unisfantasy/data
      - /srv/unisfantasy/state:/srv/unisfantasy/state
      - /srv/unisfantasy/secrets:/srv/unisfantasy/secrets:ro
    restart: unless-stopped
    ports:
      - "5000:5000"

  discord-bot:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: unisfantasy-discord-bot
    command: ["python", "-m", "services.discord_bot.entrypoint"]
    env_file:
      - ./env/discord-bot.env
    volumes:
      - /srv/unisfantasy/data:/srv/unisfantasy/data
      - /srv/unisfantasy/state:/srv/unisfantasy/state
      - /srv/unisfantasy/secrets:/srv/unisfantasy/secrets:ro
    restart: unless-stopped
